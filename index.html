<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061316"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Бюджет двоих</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.svg">
<style>
:root{color-scheme:dark;--bg:#061316;--card:#0d2329;--accent:#34f5c5;--ink:#ecfdf5;--muted:#7fa1a8;--border:rgba(52,245,197,.18);--danger:#ff4d2d;--warn:#f5c84c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .25s;color-scheme:dark}body.loss{--bg:#110909;--card:#1f1112;--accent:#ff4d2d;--ink:#ff8a75;--muted:#9e8888;--border:rgba(255,77,45,.22)}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.wrap{max-width:760px;margin:auto;padding:24px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{font-size:22px;margin:0;font-weight:700}.muted{color:var(--muted)}.small{font-size:12px}.upper{text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.big{font-size:20px;margin-top:6px;overflow-wrap:anywhere}.accent{color:var(--accent)}.bar{height:11px;border-radius:20px;background:#0005;overflow:hidden;display:flex}.bar span{height:100%}.btn{border:1px solid var(--border);background:transparent;border-radius:14px;padding:10px 14px}.primary{border:0;background:var(--accent);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:700}.full{width:100%}.input{width:100%;min-width:0;background:#0005;border:1px solid var(--border);border-radius:13px;padding:11px 12px;color:var(--ink);outline:none}.input:focus{border-color:var(--accent)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stack{display:grid;gap:9px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#071719ed;backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:8px 4px max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center}.tabs-inner{width:min(760px,100%);display:flex}.tab{flex:1;border:0;background:none;color:var(--muted);font-size:11px;padding:5px 1px;display:grid;gap:4px;justify-items:center}.tab b{font-size:19px;font-weight:400}.tab.active{color:var(--accent)}.list{list-style:none;padding:0;margin:0}.list li{padding:10px 0;border-bottom:1px solid var(--border)}.list li:last-child{border-bottom:0}.pill{border-radius:30px;padding:6px 10px;font-size:12px}.danger{color:var(--danger)}.progress{height:7px;background:#0005;border-radius:20px;overflow:hidden;margin-top:6px}.progress span{height:100%;display:block;border-radius:20px}.empty{color:var(--muted);font-size:14px;padding:8px 0}.right{text-align:right}.hide{display:none!important}.hint{font-size:12px;color:var(--muted);margin:7px 0 0}.section-title{margin:0 0 12px}.amount-positive{color:var(--accent)}@media(max-width:380px){.grid3{gap:6px}.card{padding:13px}.big{font-size:17px}.tab{font-size:10px}}
</style></head>
<body><main id="app" class="wrap"></main><nav id="tabs" class="tabs"><div class="tabs-inner"></div></nav>
<script>
(()=>{'use strict';
const KEY='finDuo:state',MONTH=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const DEFAULT_CATS=[{id:'food',name:'Еда',type:'expense',icon:'🍜',quick:true},{id:'coffee',name:'Кофе',type:'expense',icon:'☕',quick:true},{id:'transport',name:'Транспорт',type:'expense',icon:'🚌',quick:true},{id:'fun',name:'Развлечения',type:'expense',icon:'🎬'},{id:'health',name:'Здоровье',type:'expense',icon:'💊'},{id:'home',name:'Дом',type:'expense',icon:'🏠'},{id:'salary',name:'Зарплата',type:'income',icon:'💼'},{id:'gift',name:'Подарки',type:'income',icon:'🎁'}];
const INITIAL={transactions:[],categories:DEFAULT_CATS,goals:{},recurring:[],settings:{startingSavings:0,users:['Я','Партнёр'],currentUser:'Я',lastCelebrated:null}};
let state=load(),tab='dashboard',smart='',formType='expense',selectedCat='',editDate=today(),message='';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===1?x.data:structuredClone(INITIAL)}catch{return structuredClone(INITIAL)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,data:state}))}catch{}}
function today(){return new Date().toISOString().slice(0,10)}function money(n){return Number(n||0).toLocaleString('ru-RU')+' ₽'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthTx(){return state.transactions.filter(t=>(t.date||'').startsWith(MONTH()))}function sum(list,type){return list.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.amount||0),0)}function cat(id){return state.categories.find(c=>c.id===id)}function persist(){save();render()}
const app=document.getElementById('app'),tabs=document.querySelector('.tabs-inner');
const TABLIST=[['dashboard','⚔️','Битва'],['tx','💸','Операции'],['cats','🏷️','Категории'],['an','📊','Аналитика'],['set','⚙️','Настройки']];
function card(html,cls=''){return `<section class="card ${cls}">${html}</section>`}function title(t){return `<div class="top"><h1>${t}</h1><span class="upper">${new Date().toLocaleDateString('ru-RU',{month:'long'})}</span></div>`}
function renderTabs(){tabs.innerHTML=TABLIST.map(([id,ic,label])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}"><b>${ic}</b><span>${label}</span></button>`).join('')}
function dashboard(){const tx=monthTx(),income=sum(tx,'income'),expense=sum(tx,'expense'),balance=income-expense,savings=Number(state.settings.startingSavings||0)+balance;const d=new Date(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1,safe=Math.floor(Math.max(balance,0)/days);const top=tx.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount).slice(0,3);const due=state.recurring.filter(r=>r.lastPaid!==MONTH());const total=income+expense||1;
let html=title('Бюджет двоих');html+=card(`<div class="row muted small"><span>Доходы</span><span>Расходы</span></div><div class="bar" style="margin-top:12px"><span style="width:${income/total*100}%;background:#34f5c5"></span><span style="width:${expense/total*100}%;background:#ff4d2d"></span></div><div class="row" style="margin-top:10px"><span class="num accent">${money(income)}</span><span class="num">${money(expense)}</span></div>`);
html+=`<div class="grid3">${[['Накопления',money(savings)],['Баланс',(balance>=0?'+':'')+money(balance)],['Расход',money(expense)]].map(([a,b])=>card(`<div class="small muted">${a}</div><div class="num big">${b}</div>`)).join('')}</div>`;
html+=card(`<div class="row"><div><div class="upper">Безопасно сегодня</div><div class="num big">${money(safe)}</div></div><div class="right muted small">дней<div class="num big accent">${days}</div></div></div>`);
if(due.length)html+=card(`<div class="upper" style="margin-bottom:10px">Регулярные платежи</div><ul class="list">${due.map(r=>`<li class="row"><span>${esc(r.title)}</span><span class="row"><b class="num accent">${money(r.amount)}</b><button class="btn" data-pay="${r.id}">✓</button></span></li>`).join('')}</ul>`);
html+=card(`<div class="upper" style="margin-bottom:10px">На что обратить внимание</div>${top.length?`<ul class="list">${top.map(t=>`<li class="row"><span>${cat(t.categoryId)?.icon||'•'} ${esc(cat(t.categoryId)?.name||t.note||'Операция')}</span><b class="num accent">−${money(t.amount)}</b></li>`).join('')}</ul>`:'<div class="empty">Пока пусто 🌱</div>'}`);
const prog=state.categories.filter(c=>c.type==='expense').map(c=>{const spent=tx.filter(t=>t.categoryId===c.id).reduce((a,t)=>a+Number(t.amount),0),lim=Number(state.goals[c.id]||0);return {...c,spent,lim,pct:lim?spent/lim:0}}).filter(x=>x.lim||x.spent);
if(prog.length)html+=card(`<div class="upper" style="margin-bottom:10px">Прогресс по лимитам</div>${prog.map(x=>`<div style="margin:10px 0"><div class="row small"><span>${x.icon} ${esc(x.name)}</span><span class="num muted">${money(x.spent)}${x.lim?' / '+money(x.lim):''}</span></div><div class="progress"><span style="width:${Math.min(x.pct*100,100)}%;background:${x.pct>=1?'#ff4d2d':x.pct>=.8?'#f5c84c':'var(--accent)'}"></span></div></div>`).join('')}`);
html+=`<button class="primary full" data-tab="tx">+ Новая операция</button>`;return html}
function transactions(){const tx=monthTx().sort((a,b)=>b.date.localeCompare(a.date));const quick=state.categories.filter(c=>c.quick&&c.type==='expense');return title('Операции')+card(`<form id="smartForm"><label class="upper">Умный ввод</label><div class="row" style="margin-top:8px"><input class="input" id="smart" placeholder="Кофе 300" value="${esc(smart)}"><button class="primary">→</button></div><p class="hint">«Кофе 300» → расход. «Зарплата +50000» → доход.</p></form>`)+`<div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:12px">${quick.map(c=>`<button class="btn" data-quick="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}</div>`+card(`<form id="manualForm" class="stack"><div class="row"><button type="button" class="${formType==='expense'?'primary':'btn'}" data-type="expense">Расход</button><button type="button" class="${formType==='income'?'primary':'btn'}" data-type="income">Доход</button></div><div class="formgrid"><input class="input" id="amount" type="number" min="0.01" step="0.01" placeholder="Сумма" required><input class="input" id="date" type="date" value="${editDate}"></div><div class="formgrid"><select class="input" id="category"><option value="">— категория —</option>${state.categories.filter(c=>c.type===formType).map(c=>`<option value="${c.id}" ${selectedCat===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select><select class="input" id="paidBy">${state.settings.users.map(u=>`<option>${esc(u)}</option>`).join('')}</select></div><input class="input" id="note" placeholder="Комментарий"><button class="primary full">Сохранить</button></form>`)+card(`<div class="upper" style="margin-bottom:8px">История за месяц</div>${tx.length?`<ul class="list">${tx.map(t=>`<li class="row"><div style="min-width:0"><div>${cat(t.categoryId)?.icon||'•'} ${esc(cat(t.categoryId)?.name||t.note||'Операция')}</div><div class="small muted">${esc(t.date)} · ${esc(t.paidBy||'')}${t.note?' · '+esc(t.note):''}</div></div><div class="row"><b class="num ${t.type==='income'?'accent':''}">${t.type==='income'?'+':'−'}${money(t.amount)}</b><button class="btn" data-delete="${t.id}">✕</button></div></li>`).join('')}</ul>`:'<div class="empty">Пока нет операций</div>'}`)}
function categories(){return title('Категории и лимиты')+card(`<form id="catForm" class="stack"><div class="formgrid"><input class="input" id="catName" placeholder="Название" required><input class="input" id="catIcon" placeholder="🍜"><select class="input" id="catType"><option value="expense">Расход</option><option value="income">Доход</option></select></div><button class="primary full">+ Добавить</button></form>`)+['expense','income'].map(type=>card(`<div class="upper" style="margin-bottom:10px">${type==='expense'?'Расходы':'Доходы'}</div><ul class="list">${state.categories.filter(c=>c.type===type).map(c=>`<li class="row"><span>${c.icon} ${esc(c.name)}</span><span class="row">${type==='expense'?`<input class="input" style="width:100px;padding:7px;text-align:right" type="number" min="0" placeholder="лимит" data-goal="${c.id}" value="${state.goals[c.id]||''}">`:''}<button class="btn" data-catdelete="${c.id}">✕</button></span></li>`).join('')}</ul>`)).join('')}
function analytics(){const [y,m]=MONTH().split('-').map(Number),prev=y+'-'+String(m===1?12:m-1).padStart(2,'0'),cur=monthTx(),p=state.transactions.filter(t=>(t.date||'').startsWith(prev)),ce=sum(cur,'expense'),pe=sum(p,'expense'),ci=sum(cur,'income');const by={};cur.filter(t=>t.type==='expense').forEach(t=>by[t.categoryId||'none']=(by[t.categoryId||'none']||0)+Number(t.amount));const entries=Object.entries(by).sort((a,b)=>b[1]-a[1]);const diff=pe?Math.round((ce-pe)/pe*100):null;return title('Аналитика')+card(`<div class="upper" style="margin-bottom:10px">Инсайты</div><ul class="list">${diff!==null?`<li>${diff<=0?'🎉 Потратили на '+Math.abs(diff)+'% меньше прошлого месяца':'⚠️ Расходы выросли на '+diff+'%'}</li>`:''}${entries[0]?`<li>💸 Больше всего: ${esc(cat(entries[0][0])?.name||'Без категории')} — ${money(entries[0][1])}</li>`:''}${ci>ce?`<li>💚 В плюсе на ${money(ci-ce)}</li>`:''}${!diff&&!entries.length?'<li class="muted">Пока недостаточно данных для выводов</li>':''}</ul>`)+card(`<div class="upper" style="margin-bottom:10px">Расходы по категориям</div>${entries.length?entries.map(([id,a])=>{const pct=Math.round(a/(ce||1)*100);return `<div style="margin:12px 0"><div class="row small"><span>${cat(id)?.icon||'•'} ${esc(cat(id)?.name||'Без категории')}</span><span class="num muted">${money(a)} · ${pct}%</span></div><div class="progress"><span style="width:${pct}%;background:var(--accent)"></span></div></div>`}).join(''):'<div class="empty">Пока нет расходов</div>'}`)+card(`<div class="upper" style="margin-bottom:10px">Сравнение месяца</div><div class="row"><span>Доходы</span><b class="num accent">${money(ci)}</b></div><div class="row" style="margin-top:8px"><span>Расходы</span><b class="num">${money(ce)}</b></div><div class="row" style="margin-top:8px"><span>Баланс</span><b class="num">${money(ci-ce)}</b></div>`)}
function settings(){return title('Настройки')+(message?card(`<span class="accent">${esc(message)}</span>`):'')+card(`<div class="upper" style="margin-bottom:10px">Стартовые накопления</div><div class="row"><input class="input" id="savings" type="number" value="${Number(state.settings.startingSavings||0)}"><button class="primary" data-save-savings>OK</button></div>`)+card(`<div class="upper" style="margin-bottom:10px">Регулярные платежи</div>${state.recurring.length?`<ul class="list">${state.recurring.map(r=>`<li class="row"><span>${esc(r.title)} · ${r.day}-го</span><span class="row"><b class="num">${money(r.amount)}</b><button class="btn" data-recdel="${r.id}">✕</button></span></li>`).join('')}</ul>`:''}<form id="recForm" class="stack" style="margin-top:12px"><input class="input" id="recTitle" placeholder="Название платежа" required><div class="formgrid"><input class="input" id="recAmount" type="number" min="0.01" placeholder="Сумма" required><input class="input" id="recDay" type="number" min="1" max="31" value="1" placeholder="День"></div><button class="btn full">+ Добавить</button></form>`)+card(`<div class="upper" style="margin-bottom:10px">Участники</div>${state.settings.users.map((u,i)=>`<input class="input" style="margin-bottom:8px" data-user="${i}" value="${esc(u)}">`).join('')}<button class="btn full" data-save-users>Сохранить имена</button>`)+card(`<div class="upper" style="margin-bottom:10px">Резервная копия</div><div class="formgrid"><button class="btn" data-export>⬇ Скачать</button><button class="btn" data-import>⬆ Загрузить</button><input id="importFile" type="file" accept="application/json" class="hide"></div>`)+`<button class="btn full danger" data-clear style="border-color:#ff4d2d66">Удалить все данные</button>`}
function render(){document.body.classList.toggle('loss',sum(monthTx(),'expense')>sum(monthTx(),'income'));renderTabs();app.innerHTML=tab==='dashboard'?dashboard():tab==='tx'?transactions():tab==='cats'?categories():tab==='an'?analytics():settings()}
function addTx(tx){state.transactions.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),...tx});persist()}
function parseSmart(s){const m=s.match(/([+-])?\s*(\d+(?:[.,]\d{1,2})?)/);if(!m)return null;const amount=parseFloat(m[2].replace(',','.'));if(!amount)return null;let c=state.categories.filter(x=>s.toLowerCase().includes(x.name.toLowerCase())).sort((a,b)=>b.name.length-a.name.length)[0];let note=s;if(c)note=note.replace(new RegExp(c.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'');note=note.replace(m[0],'').trim();return {type:c?c.type:(m[1]==='+'?'income':'expense'),amount,categoryId:c?.id||null,note}}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.type){formType=b.dataset.type;render();return}if(b.dataset.quick){selectedCat=b.dataset.quick;formType='expense';document.getElementById('category').value=selectedCat;return}if(b.dataset.delete){state.transactions=state.transactions.filter(t=>t.id!==b.dataset.delete);persist();return}if(b.dataset.catdelete){state.categories=state.categories.filter(c=>c.id!==b.dataset.catdelete);delete state.goals[b.dataset.catdelete];persist();return}if(b.dataset.pay){const r=state.recurring.find(x=>x.id===b.dataset.pay);if(r){addTx({type:r.type,amount:r.amount,date:today(),categoryId:r.categoryId||null,note:r.title,paidBy:state.settings.currentUser});state.recurring=state.recurring.map(x=>x.id===r.id?{...x,lastPaid:MONTH()}:x);save();render()}return}if(b.dataset.recdel){state.recurring=state.recurring.filter(r=>r.id!==b.dataset.recdel);persist();return}if(b.hasAttribute('data-save-savings')){state.settings.startingSavings=Number(document.getElementById('savings').value)||0;message='Сохранено';persist();return}if(b.hasAttribute('data-save-users')){state.settings.users=[...document.querySelectorAll('[data-user]')].map(x=>x.value.trim()).filter(Boolean);if(!state.settings.users.length)state.settings.users=['Я','Партнёр'];state.settings.currentUser=state.settings.users[0];message='Имена сохранены';persist();return}if(b.hasAttribute('data-export')){const blob=new Blob([JSON.stringify({app:'finance-duo',data:{state:{version:1,data:state}}},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='budget-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);return}if(b.hasAttribute('data-import')){document.getElementById('importFile').click();return}if(b.hasAttribute('data-clear')){if(confirm('Удалить все данные?')){localStorage.removeItem(KEY);state=structuredClone(INITIAL);message='';persist()}return}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='smartForm'){smart=document.getElementById('smart').value;const p=parseSmart(smart);if(!p){message='Не удалось распознать сумму';render();return}addTx({...p,date:editDate,paidBy:state.settings.currentUser});smart='';return}if(e.target.id==='manualForm'){const amount=Number(document.getElementById('amount').value);if(!amount)return;addTx({type:formType,amount,categoryId:document.getElementById('category').value||null,note:document.getElementById('note').value.trim(),date:document.getElementById('date').value||today(),paidBy:document.getElementById('paidBy').value||state.settings.currentUser});selectedCat='';return}if(e.target.id==='catForm'){const name=document.getElementById('catName').value.trim();if(!name)return;const type=document.getElementById('catType').value;state.categories.push({id:'custom_'+Date.now(),name,type,icon:document.getElementById('catIcon').value.trim()||(type==='income'?'💰':'🛒')});persist();return}if(e.target.id==='recForm'){const name=document.getElementById('recTitle').value.trim(),amount=Number(document.getElementById('recAmount').value),day=Math.max(1,Math.min(31,Number(document.getElementById('recDay').value)||1));if(!name||!amount)return;state.recurring.push({id:'rec_'+Date.now(),title:name,amount,day,type:'expense',lastPaid:null});persist()}});
app.addEventListener('input',e=>{if(e.target.id==='smart')smart=e.target.value;if(e.target.id==='date')editDate=e.target.value;if(e.target.dataset.goal){state.goals[e.target.dataset.goal]=Number(e.target.value)||0;save()}});
app.addEventListener('change',e=>{if(e.target.id==='importFile'){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const j=JSON.parse(reader.result);const v=j.data?.state?.data||j.data?.state||j.data;if(v?.categories&&v?.transactions){state=v;persist();message='Резервная копия загружена'}else alert('Файл не похож на резервную копию приложения')}catch{alert('Не удалось прочитать файл')}};reader.readAsText(f)}});
render();
})();
</script></body></html>
